constraints:
  - "替换须用「单次扫描（正则 alternation）+ 左边界 `(?<![A-Za-z])`」引擎，**禁止**逐条 str.replace（rename-refactor 规程）"
  - "替换引擎须**幂等**：对已改名文本重复执行结果不变"
  - "**显式排除区**（历史快照，保留旧名，不参与断言）：`.fstdd/archive/**`、`deliverables/archive/**`、`deliverables/gstack/**`、`RELEASE-AUDIT.md`、`*.bak-*` 目录、`D:/tools/多层次agent/.workbuddy-ai/memory/**` 历史日志"
  - "数据迁移须**只读旧、写新、不删旧**（可回滚）；旧文件保留为只读证据"
  - "旧 owner 值 `free-model-relay` 必须**继续被识别**为 relay 所有（双值兼容，不得硬切换）"
  - "`agentinn` 入口须零交互、纯转发（不复制业务逻辑）；Windows(Git Bash)/Linux/macOS 三平台可用"
  - "除命名/路径/标记兼容外，**业务行为逐字不变**（调度/时段/向导语义不动）"
  - "目录改名须在 Phase 4 最后执行（FSTDD 项目根即 skill 目录，提前改名会破坏 CLI 与 git）"

