meta:
  change_id: "2026-10-13-relay-agentinn-rename"
  title: "free-model-relay → agentinn：全量改名 + 真实可执行入口 + 数据迁移"
  created: "2026-10-13T07:45:00+08:00"
  status: draft
  version: "3.0"

why:
  problem: |
    技能现名 `free-model-relay` 语义过窄且与实际能力不符：它早已不只是「免费模型」，
    而是「多模型接棒器 / 模型旅店」（自定义免费 + 平台内置 + 桥接源，统一调度、时段感知、策略分配）。
    同时**没有真实可执行入口** —— 用户/AI 只能写全路径
    `python ~/.workbuddy/skills/free-model-relay/scripts/pick_model.py <cmd>`，
    既冗长又绑死目录名，改名成本高、可读性差。
    用户 2026-10-12 明确要求：改名为 `agentinn`，且**启动命令就是 `agentinn`**。
  motivation: |
    改名 + 真入口一次性解决三件事：(1) 名称如实反映能力（模型旅店）；(2) 用户/AI 用
    `agentinn <cmd>` 即可，不再记路径；(3) 数据文件名与目录名统一到 `agentinn`，消除品牌残留。
    风险集中在「改完不等于能用」——改名面横跨源码/文档/目录/文件名/安装位置/数据/标记，
    故本 change 采用「枚举 → 单次扫描替换 → TDD 双向断言 → 分层验证 → 四类评审 → 同步仓库外实体」
    的严格改名规程（本机 `rename-refactor` skill）。
  evidence:
    observed_at: "2026-10-13T07:40:00+08:00"
    observed_base_git_sha: "23f8b7d（relay v5.6.1 交付提交）"
    details: |
      2026-10-13 全库侦察结果：
      (1) 源码/文档命中：SKILL.md 15 处、relay_instruction.md 10 处、scripts/pick_model.py 7 处
      （含 _STATE_NAME/_USAGE_NAME/_OVERRIDE_WIN_NAME 三个数据文件名常量 + RELAY_OWNER_VALUE）。
      (2) 目录：`~/.workbuddy/skills/free-model-relay/`、`~/.workbuddy-ai/skills/free-model-relay/`
      两根各一份（+ 3 个 .bak-* 历史目录）。
      (3) 现存旧数据（仅 WB 根）：free-model-relay-state.json、free-model-relay-usage.json
      （+ 一个 stray .stray-bak-20261010）；AI 根无。
      (4) models.json 中**当前无** `relayOwner` 条目（无需数据侧标记迁移，但判定逻辑仍须双值兼容）。
      (5) 其它 skill 与 AGENTS.md/FSTDD_CONSTITUTION.md **0 命中** ⇒ 无跨技能耦合。
      (6) 分发物命中：install.sh / agenthub-install.sh / build_agenthub.py / README.md /
      INTEGRATION.md / ROADMAP.md / pick.py / verify_payload.py / _sync_install_payload.py。

